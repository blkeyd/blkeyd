<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" width="420" height="260" role="img" aria-label="Most used languages for blkeyd">
  <defs>
    <style>
      .title { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #E59A3A; }
      .lang { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 12px; fill: #E8EBF0; }
      .pct { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: #6E7893; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="419" height="259" rx="10" fill="#111827" stroke="#22293B"/>
  <text x="16" y="30" class="title">Most Used Languages</text>
  <line x1="16" y1="40" x2="404" y2="40" stroke="#22293B" stroke-width="1"/>
  
        <text x="16" y="70" class="lang">Jupyter Notebook</text>
        <rect x="120" y="58" width="280" height="12" rx="6" fill="#22293B"/>
