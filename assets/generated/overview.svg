<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 240" width="488" height="240" role="img" aria-label="GitHub stats overview placeholder">
  <defs>
    <style>
      .title { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #E59A3A; }
      .msg { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; fill: #9AA4B8; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="487" height="239" rx="10" fill="#111827" stroke="#22293B"/>
  <text x="16" y="30" class="title">GitHub Stats</text>
  <line x1="16" y1="40" x2="472" y2="40" stroke="#22293B" stroke-width="1"/>
  <text x="16" y="80" class="msg">Run the "Update GitHub Stats" Action once</text>
  <text x="16" y="100" class="msg">to generate this card from live data.</text>
</svg>
