<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MD Sayed Hasan, AI and Software Engineering student working on computer vision, deep learning and full-stack development. A 3 by 3 kernel slides across a matrix of activation values and builds a feature map.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E59A3A"/>
      <stop offset="100%" stop-color="#F7C77E"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F3F5F8"/>
      <stop offset="100%" stop-color="#E59A3A"/>
    </linearGradient>
    <radialGradient id="glowspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E59A3A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E59A3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#E59A3A" stroke-width="0.5" opacity="0.05"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .num  { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
               font-size: 11px; text-anchor: middle; }
      .eyebrow { font-size: 12px; letter-spacing: 3.6px; fill: #E59A3A; opacity: .85; }
      .name { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
               font-size: 54px; fill: url(#nameFill); letter-spacing: -0.4px; }
      .sub { font-size: 13.5px; letter-spacing: .3px; fill: #9AA4B8; }
      .cap { font-size: 10.5px; letter-spacing: 2.2px; fill: #6E7893; opacity: .9; }

      #kernel { animation: kernel 9.6s steps(1, end) infinite; }
      @keyframes kernel {
        0.0000% { transform: translate(0px, 0px); }
        8.3333% { transform: translate(40px, 0px); }
        16.6667% { transform: translate(80px, 0px); }
        25.0000% { transform: translate(120px, 0px); }
        33.3333% { transform: translate(0px, 34px); }
        41.6667% { transform: translate(40px, 34px); }
        50.0000% { transform: translate(80px, 34px); }
        58.3333% { transform: translate(120px, 34px); }
        66.6667% { transform: translate(0px, 68px); }
        75.0000% { transform: translate(40px, 68px); }
        83.3333% { transform: translate(80px, 68px); }
        91.6667% { transform: translate(120px, 68px); }
      }

      .o { fill: #E59A3A; opacity: .06;
            animation-duration: 9.6s; animation-timing-function: steps(1, end);
            animation-iteration-count: infinite; }
      .o0 { animation-name: fill0; } .o1 { animation-name: fill1; } .o2 { animation-name: fill2; }
      .o3 { animation-name: fill3; } .o4 { animation-name: fill4; } .o5 { animation-name: fill5; }
      .o6 { animation-name: fill6; } .o7 { animation-name: fill7; } .o8 { animation-name: fill8; }
      .o9 { animation-name: fill9; } .o10 { animation-name: fill10; } .o11 { animation-name: fill11; }
      @keyframes fill0 { 0%,0.0000% { opacity:.06 } 8.3333%,100% { opacity:.9 } }
      @keyframes fill1 { 0%,8.3333% { opacity:.06 } 16.6667%,100% { opacity:.9 } }
      @keyframes fill2 { 0%,16.6667% { opacity:.06 } 25.0000%,100% { opacity:.9 } }
      @keyframes fill3 { 0%,25.0000% { opacity:.06 } 33.3333%,100% { opacity:.9 } }
      @keyframes fill4 { 0%,33.3333% { opacity:.06 } 41.6667%,100% { opacity:.9 } }
      @keyframes fill5 { 0%,41.6667% { opacity:.06 } 50.0000%,100% { opacity:.9 } }
      @keyframes fill6 { 0%,50.0000% { opacity:.06 } 58.3333%,100% { opacity:.9 } }
      @keyframes fill7 { 0%,58.3333% { opacity:.06 } 66.6667%,100% { opacity:.9 } }
      @keyframes fill8 { 0%,66.6667% { opacity:.06 } 75.0000%,100% { opacity:.9 } }
      @keyframes fill9 { 0%,75.0000% { opacity:.06 } 83.3333%,100% { opacity:.9 } }
      @keyframes fill10 { 0%,83.3333% { opacity:.06 } 91.6667%,100% { opacity:.9 } }
      @keyframes fill11 { 0%,91.6667% { opacity:.06 } 100.0000%,100% { opacity:.9 } }

      #scan { animation: scan 6s linear infinite; }
      @keyframes scan {
        0% { transform: translateX(-60px); opacity: 0; }
        8% { opacity: .5; }
        50% { opacity: .5; }
        92% { opacity: 0; }
        100% { transform: translateX(1200px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        #kernel, #scan { animation: none; }
        .o { animation: none; opacity: .5; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)"/>
  <circle cx="150" cy="60" r="220" fill="url(#glowspot)"/>
  <circle cx="1050" cy="250" r="260" fill="url(#glowspot)"/>

  <!-- corner circuit accents -->
  <path d="M 20 20 L 20 44 M 20 20 L 44 20" stroke="#E59A3A" stroke-width="1.4" opacity=".55" fill="none"/>
  <path d="M 1180 280 L 1180 256 M 1180 280 L 1156 280" stroke="#E59A3A" stroke-width="1.4" opacity=".55" fill="none"/>
  <circle cx="20" cy="20" r="2.2" fill="#E59A3A" opacity=".8"/>
  <circle cx="1180" cy="280" r="2.2" fill="#E59A3A" opacity=".8"/>

  <!-- scan line -->
  <rect id="scan" x="0" y="0" width="2" height="300" fill="#E59A3A" opacity=".5"/>

  <!-- identity -->
  <text class="mono eyebrow" x="64" y="104">AI &#38; SOFTWARE ENGINEERING STUDENT &#183; DHAKA</text>
  <text class="name" x="62" y="166" filter="url(#softGlow)">MD Sayed Hasan</text>
  <rect x="64" y="188" width="64" height="3" rx="1.5" fill="url(#rule)"/>
  <text class="mono sub" x="64" y="224">computer vision &#183; deep learning &#183; full-stack dev &#183; bangla nlp</text>
  <text class="mono cap" x="64" y="252">BUILDING AI-POWERED APPLICATIONS</text>

