<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Arafat Hossain, AI and ML engineer working on computer vision, NLP and retrieval systems. A 3 by 3 kernel slides across a matrix of activation values and builds a feature map.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191724"/>
      <stop offset="55%" stop-color="#1f1d2e"/>
      <stop offset="100%" stop-color="#191724"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eb6f92"/>
      <stop offset="100%" stop-color="#f6c177"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .num  { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
               font-size: 11px; text-anchor: middle; }
      .eyebrow { font-size: 12px; letter-spacing: 3.6px; fill: #908caa; }
      .name { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
               font-size: 56px; fill: #e0def4; letter-spacing: -0.4px; }
      .sub { font-size: 14px; letter-spacing: .3px; fill: #908caa; }
      .cap { font-size: 10.5px; letter-spacing: 2.2px; fill: #908caa; opacity: .75; }

      #kernel { animation: kernel 9.6s steps(1, end) infinite; }
      @keyframes kernel {
        0.0000% { transform: translate(0px, 0px); }
        8.3333% { transform: translate(40px, 0px); }
        16.6667% { transform: translate(80px, 0px); }
        25.0000% { transform: translate(120px, 0px); }
        33.3333% { transform: translate(0px, 34px); }
        41.6667% { transform: translate(40px, 34px); }
        50.0000% { transform: translate(80px, 34px); }
        58.3333% { transform: translate(120px, 34px); }
        66.6667% { transform: translate(0px, 68px); }
        75.0000% { transform: translate(40px, 68px); }
        83.3333% { transform: translate(80px, 68px); }
        91.6667% { transform: translate(120px, 68px); }
      }

      .o { fill: #c4a7e7; opacity: .07;
            animation-duration: 9.6s; animation-timing-function: steps(1, end);
            animation-iteration-count: infinite; }
      .o0 { animation-name: fill0; }
      .o1 { animation-name: fill1; }
      .o2 { animation-name: fill2; }
      .o3 { animation-name: fill3; }
      .o4 { animation-name: fill4; }
      .o5 { animation-name: fill5; }
      .o6 { animation-name: fill6; }
      .o7 { animation-name: fill7; }
      .o8 { animation-name: fill8; }
      .o9 { animation-name: fill9; }
      .o10 { animation-name: fill10; }
      .o11 { animation-name: fill11; }
      @keyframes fill0 { 0%,0.0000% { opacity:.07 } 8.3333%,100% { opacity:.92 } }
      @keyframes fill1 { 0%,8.3333% { opacity:.07 } 16.6667%,100% { opacity:.92 } }
      @keyframes fill2 { 0%,16.6667% { opacity:.07 } 25.0000%,100% { opacity:.92 } }
      @keyframes fill3 { 0%,25.0000% { opacity:.07 } 33.3333%,100% { opacity:.92 } }
      @keyframes fill4 { 0%,33.3333% { opacity:.07 } 41.6667%,100% { opacity:.92 } }
      @keyframes fill5 { 0%,41.6667% { opacity:.07 } 50.0000%,100% { opacity:.92 } }
      @keyframes fill6 { 0%,50.0000% { opacity:.07 } 58.3333%,100% { opacity:.92 } }
      @keyframes fill7 { 0%,58.3333% { opacity:.07 } 66.6667%,100% { opacity:.92 } }
      @keyframes fill8 { 0%,66.6667% { opacity:.07 } 75.0000%,100% { opacity:.92 } }
      @keyframes fill9 { 0%,75.0000% { opacity:.07 } 83.3333%,100% { opacity:.92 } }
      @keyframes fill10 { 0%,83.3333% { opacity:.07 } 91.6667%,100% { opacity:.92 } }
      @keyframes fill11 { 0%,91.6667% { opacity:.07 } 100.0000%,100% { opacity:.92 } }

      @media (prefers-reduced-motion: reduce) {
        #kernel { animation: none; }
        .o { animation: none; opacity: .55; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="12" fill="url(#bg)"/>

  <!-- identity -->
  <text class="mono eyebrow" x="66" y="106">AI &#47; ML ENGINEER &#183; DHAKA</text>
  <text class="name" x="64" y="168">MD Sayed Hasan</text>
  <rect x="66" y="190" width="62" height="3" rx="1.5" fill="url(#rule)"/>
  <text class="mono sub" x="66" y="226">vision-language models &#183; retrieval systems &#183; bangla nlp</text>

  <line x1="600" y1="72" x2="600" y2="254" stroke="#26233a" stroke-width="1"/>

