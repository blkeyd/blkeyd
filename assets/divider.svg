<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-label="starfield section divider">
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="15%" stop-color="#111827" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#111827" stop-opacity=".7"/>
      <stop offset="85%" stop-color="#111827" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E59A3A" stop-opacity="0"/>
      <stop offset="12%" stop-color="#E59A3A" stop-opacity=".8"/>
      <stop offset="50%" stop-color="#E59A3A" stop-opacity=".28"/>
      <stop offset="88%" stop-color="#E59A3A" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#E59A3A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dstar { fill: #E59A3A; animation-name: dtwinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      .dstar-w { fill: #E8EBF0; }
      @keyframes dtwinkle {
        0%, 100% { opacity: .12; }
        50% { opacity: .95; }
      }
      .node { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .node2 { animation-delay: .8s; }
      .node3 { animation-delay: 1.6s; }
      @keyframes pulse {
        0%, 100% { opacity: .35; r: 2.4; }
        50% { opacity: 1; r: 4; }
      }
      .shoot { animation: shoot 7s linear infinite; opacity: 0; }
      .shoot2 { animation-delay: 3.4s; }
      @keyframes shoot {
        0% { transform: translate(0,0); opacity: 0; }
        2% { opacity: .9; }
        10% { transform: translate(140px, 26px); opacity: 0; }
        100% { transform: translate(140px, 26px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dstar, .node, .shoot { animation: none; }
        .dstar { opacity: .4; }
        .node { opacity: .8; }
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="60" fill="url(#skyFade)"/>

