<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E59A3A" stop-opacity="0"/>
      <stop offset="12%" stop-color="#E59A3A" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#E59A3A" stop-opacity=".35"/>
      <stop offset="88%" stop-color="#E59A3A" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#E59A3A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .node { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .node2 { animation-delay: .8s; }
      .node3 { animation-delay: 1.6s; }
      @keyframes pulse {
        0%, 100% { opacity: .35; r: 2.4; }
        50% { opacity: 1; r: 4; }
      }
      @media (prefers-reduced-motion: reduce) { .node { animation: none; opacity: .8; } }
    </style>
  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#lineFade)" stroke-width="1.4"/>
  <circle class="node" cx="150" cy="20" r="2.4" fill="#E59A3A"/>
  <circle class="node node2" cx="600" cy="20" r="2.4" fill="#E59A3A"/>
  <circle class="node node3" cx="1050" cy="20" r="2.4" fill="#E59A3A"/>
</svg>
